name: Susan AI release

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Susan AI web URL used by the Android wrapper"
        required: false
        default: "https://susan-ai.vercel.app"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  APP_URL: ${{ inputs.app_url || vars.SUSAN_AI_APP_URL || 'https://susan-ai.vercel.app' }}

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test

  build-android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor tooling
        run: npm install --no-save --no-package-lock @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Android wrapper configuration
        shell: bash
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.sanketpixel.susanai",
            "appName": "Susan AI",
            "webDir": "public",
            "server": {
              "url": "${APP_URL}",
              "cleartext": false
            }
          }
          EOF
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/Susan-AI-${GITHUB_REF_NAME}-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: susan-ai-android
          path: release/*.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows installers
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run desktop:build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: susan-ai-windows
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-android
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: susan-ai-android
          path: release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: susan-ai-windows
          path: release

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
