name: Susan AI release

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Susan AI web URL used by the Android wrapper"
        required: false
        default: "https://susan-ai.vercel.app"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  APP_URL: ${{ inputs.app_url || vars.SUSAN_AI_APP_URL || 'https://susan-ai.vercel.app' }}

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test

  build-android:
    name: Build Android APK and signed App Bundle
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor tooling
        run: npm install --no-save --no-package-lock @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Android wrapper configuration
        shell: bash
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.sanketpixel.susanai",
            "appName": "Susan AI",
            "webDir": "public",
            "server": {
              "url": "${APP_URL}",
              "cleartext": false
            }
          }
          EOF
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Validate Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/susan-ai-release.keystore
          test -s android/susan-ai-release.keystore
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()
          signing = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''
          if "signingConfigs {" not in text:
              text = text.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
          marker = "    buildTypes {"
          start = text.index(marker)
          release_start = text.index("release {", start)
          if "signingConfig signingConfigs.release" not in text[release_start:release_start + 300]:
              insertion = "release {\n            signingConfig signingConfigs.release"
              text = text[:release_start] + text[release_start:].replace("release {", insertion, 1)
          path.write_text(text)
          PY
          grep -q 'signingConfig signingConfigs.release' android/app/build.gradle

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build signed release App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/susan-ai-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Rename Android artifacts
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/Susan-AI-${GITHUB_REF_NAME}-android.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release/Susan-AI-${GITHUB_REF_NAME}-android-release.aab"
          rm -f android/susan-ai-release.keystore

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: susan-ai-android
          path: |
            release/*.apk
            release/*.aab
          if-no-files-found: error

  build-windows:
    name: Build Windows installers
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run desktop:build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: susan-ai-windows
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-android
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: susan-ai-android
          path: release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: susan-ai-windows
          path: release

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
