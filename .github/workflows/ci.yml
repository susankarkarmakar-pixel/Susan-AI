name: Susan AI quality gates

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint, typecheck, tests, mobile, E2E, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and integration tests
        run: npm test

      - name: Mobile contract tests
        run: npm run test:mobile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Mobile E2E tests
        run: npm run test:e2e:mobile

      - name: Production build
        run: npm run build

      - name: Dependency security audit
        # Dev-only legacy transitive packages are tracked separately; production
        # dependencies must have no high/critical advisories.
        run: npm audit --omit=dev --audit-level=high

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
